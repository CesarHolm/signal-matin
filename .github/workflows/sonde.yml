name: sonde
on:
  push:
    branches: [claude/sonde]
    paths: ["sonde.py"]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 sonde.py
      - run: |
          git config user.name "signal-matin"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapport.json && git commit -qm "Rapport de la sonde" && git push -q origin HEAD:claude/sonde
