# Publication de l'édition numérique fabriquée par la tâche planifiée Claude (abonnement).
#
# La tâche pousse un dossier editions/AAAA-MM-JJ/ (resultat.json compris) sur cette
# branche « claude/editions » ; ce workflow met en page, enregistre la mémoire du
# journal (branche journal-etat) et envoie l'e-mail via Resend.
# Le code vient de cesar/personnalisation ; secrets : RESEND_API_KEY, MAIL_DESTINATAIRE.
name: publier

on:
  push:
    branches: [claude/editions]
    paths: ["editions/**/resultat.json"]
  workflow_dispatch:
    inputs:
      dossier:
        description: "Dossier à republier (ex. editions/2026-11-05)"
        required: true

permissions:
  contents: write

concurrency:
  group: journal-quotidien
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Paris
    steps:
      - name: Code du journal
        uses: actions/checkout@v7
        with:
          ref: cesar/personnalisation

      - name: Mémoire du journal
        uses: actions/checkout@v7
        with:
          ref: journal-etat
          path: data

      - name: Édition livrée
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: livraison

      - name: Dossier de l'édition
        id: edition
        run: |
          if [ -n "${{ inputs.dossier }}" ]; then
            dossier="${{ inputs.dossier }}"
          else
            dossier=$(git -C livraison show --name-only --format= HEAD | grep '/resultat.json$' | head -1 | xargs -r dirname)
          fi
          if [ -z "$dossier" ] || [ ! -f "livraison/$dossier/resultat.json" ]; then
            echo "::error title=Édition introuvable::aucun resultat.json dans ce push"
            exit 1
          fi
          echo "dossier=livraison/$dossier" >> "$GITHUB_OUTPUT"
          echo "::notice title=Édition::$dossier"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation
        run: |
          pip install -e .
          cp config.cesar.example.yaml config.yaml

      - name: Mise en page et envoi
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_DESTINATAIRE: ${{ secrets.MAIL_DESTINATAIRE }}
          MAIL_EXPEDITEUR: ${{ secrets.MAIL_EXPEDITEUR }}
        run: python main.py journal-agent publier "${{ steps.edition.outputs.dossier }}" --envoyer

      - name: Enregistrer la mémoire du journal
        working-directory: data
        run: |
          git config user.name "signal-matin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Rien à enregistrer (essai ou déjà publiée)"; exit 0; fi
          git commit -m "Édition du $(date +%F) (agent)"
          git push origin HEAD:journal-etat
