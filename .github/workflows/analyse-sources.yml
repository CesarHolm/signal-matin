# Temporaire : démo avant/après sur un papier de recherche (branche analyse-sources, à supprimer).
name: analyse des sources
on:
  push:
    branches: [analyse-sources]
permissions:
  contents: write
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . pypdf
      - run: python scripts/analyse/demo_recherche.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "signal-matin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f demo && git commit -qm "Démo recherche [skip ci]" && git push -q origin HEAD:analyse-sources
