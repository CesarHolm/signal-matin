# Temporaire : analyse ponctuelle des sources (branche analyse-sources, à supprimer).
name: analyse des sources
on:
  push:
    branches: [analyse-sources]
permissions:
  contents: write
jobs:
  flux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml pydantic
      - run: python scripts/analyse/telecharger_flux.py
      - run: |
          git config user.name "signal-matin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f flux && git commit -qm "Flux récupérés [skip ci]" && git push -q origin HEAD:analyse-sources
